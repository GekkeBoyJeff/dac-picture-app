name: Supabase keep-alive

# Resets the free-tier 7-day inactivity timer so the remote-control project
# (dac-photobooth-remote) never pauses between events. Twice a week is ample.
# Needs repo Variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "17 6 * * 1,4" # Mon & Thu 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (resets inactivity timer)
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $code"
          case "$code" in
            2*) echo "keep-alive ok" ;;
            *) echo "keep-alive ping failed"; exit 1 ;;
          esac
